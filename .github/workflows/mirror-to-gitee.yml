name: Mirror to Gitee

# 把 GitHub 上的每次提交自动镜像到 Gitee。
# 安全设计：如果检测到 Gitee 上存在 GitHub 没有的提交，任务会失败并拒绝覆盖，
# 避免自动镜像把 Gitee 侧的改动冲掉。此时请先运行反向同步脚本把改动合回 GitHub。

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH for Gitee
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$GITEE_SSH_KEY" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan -t ed25519,rsa gitee.com >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host gitee.com\n  HostName gitee.com\n  User git\n  IdentityFile ~/.ssh/gitee_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Add Gitee remote
        run: git remote add gitee git@gitee.com:xnbd5665/BaiduPcs-CS.git

      - name: Fetch all refs
        run: |
          set -euo pipefail
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
          git fetch --prune origin "+refs/tags/*:refs/tags/*"
          git fetch --prune gitee "+refs/heads/*:refs/remotes/gitee/*" || true

      - name: Guard - refuse to overwrite Gitee-only commits
        run: |
          set -euo pipefail
          fail=0
          while read -r ref; do
            branch="${ref#refs/remotes/gitee/}"
            extra=$(git rev-list --count "$ref" --not --remotes=origin)
            if [ "$extra" -gt 0 ]; then
              echo "::error::Gitee 分支 '$branch' 上有 $extra 个 GitHub 不存在的提交，已拒绝覆盖。请先运行反向同步脚本把这些改动合回 GitHub。"
              fail=1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/gitee/ | grep -v 'refs/remotes/gitee/HEAD$' || true)
          exit $fail

      - name: Push to Gitee
        run: |
          set -euo pipefail
          while read -r ref; do
            name="${ref#refs/remotes/origin/}"
            [ "$name" = "HEAD" ] && continue
            git push gitee "refs/remotes/origin/$name:refs/heads/$name" --force
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)
          git push gitee --tags --force
