name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: 构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 校验版本号 / 测试用例数 / 文档相对链接 / 数字去重，见 tools/check-docs.ps1
      - name: 文档一致性检查
        shell: pwsh
        run: ./tools/check-docs.ps1

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: 还原依赖
        run: dotnet restore BaiduPcs.slnx

      - name: 构建（Release）
        run: dotnet build BaiduPcs.slnx -c Release --no-restore

      # Windows / Linux 都是强制门槛：Linux 腿首轮观察即全绿（2026-11-25，run 45607232777），
      # 引擎测试用的本地 HttpListener 在 ubuntu-latest 上正常工作。
      - name: 运行测试
        if: runner.os == 'Windows'
        run: dotnet test BaiduPcs.Core.Tests/BaiduPcs.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: 运行测试（Linux）
        if: runner.os == 'Linux'
        run: dotnet test BaiduPcs.Core.Tests/BaiduPcs.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
