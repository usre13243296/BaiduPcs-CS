name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: 构建与测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore BaiduPcs.slnx

      - name: 构建（Release）
        run: dotnet build BaiduPcs.slnx -c Release --no-restore

      # 引擎测试依赖本地 HttpListener 测试服务器，当前基线在 Windows 上验证；
      # 其他平台只做编译验证，避免平台差异造成误报。
      - name: 运行测试
        if: runner.os == 'Windows'
        run: dotnet test BaiduPcs.Core.Tests/BaiduPcs.Core.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
